version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.11
  build:
    commands:
      - pip install -r requirements.txt
      - test -f artifacts/model.pkl
      - test -f artifacts/preprocessor.pkl
      - python -c "import application; print('import OK')"
artifacts:
  files:
    - '**/*'
  exclude-paths:
    - .git/**
    - notebook/**
    - .vscode/**